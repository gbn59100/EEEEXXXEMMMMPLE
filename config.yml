# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: gbn59100/EEEEXXXEMMMMPLE
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/eca80d94-fbfd-4790-9124-1177c05df044/pkce
  auth_token_endpoint: /sites/eca80d94-fbfd-4790-9124-1177c05df044/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://leafy-profiterole-06f644.netlify.app
local_backend: true   # pour tester en local avec « npx decap-server » (inoffensif en ligne)
locale: fr
publish_mode: simple
media_folder: assets/uploads
public_folder: /assets/uploads

# Règle d'or : AUCUN champ n'est obligatoire (required: false partout),
# pour pouvoir modifier un seul élément et republier.
collections:
  - name: site
    label: Mon site
    editor:
      preview: true
    files:
      - name: contenu
        label: Contenu du site
        file: content/site.json
        format: json
        fields:
          - { label: "Nom du restaurant", name: nom, widget: string, required: false }
          - { label: "Slogan", name: slogan, widget: string, required: false }
          - { label: "Couleur principale", name: couleur, widget: color, required: false, hint: "Boutons, prix et accents" }
          - label: "Page d'accueil"
            name: accueil
            widget: object
            required: false
            fields:
              - { label: "Titre", name: titre, widget: string, required: false }
              - { label: "Texte", name: texte, widget: text, required: false }
              - { label: "Photo", name: image, widget: image, required: false }
          - label: "Notre histoire"
            name: apropos
            widget: object
            required: false
            fields:
              - { label: "Titre", name: titre, widget: string, required: false }
              - { label: "Texte", name: texte, widget: text, required: false }
              - { label: "Photo", name: image, widget: image, required: false }
          - label: "La carte"
            name: carte
            widget: list
            required: false
            label_singular: "catégorie"
            summary: "{{fields.categorie}}"
            fields:
              - { label: "Nom de la catégorie", name: categorie, widget: string, required: false }
              - label: "Plats"
                name: plats
                widget: list
                required: false
                label_singular: "plat"
                summary: "{{fields.nom}} – {{fields.prix}}"
                fields:
                  - { label: "Nom du plat", name: nom, widget: string, required: false }
                  - { label: "Description", name: description, widget: string, required: false }
                  - { label: "Prix", name: prix, widget: string, required: false, hint: "Ex. 14 €" }
          - label: "Horaires"
            name: horaires
            widget: list
            required: false
            label_singular: "horaire"
            summary: "{{fields.jour}} : {{fields.heures}}"
            fields:
              - { label: "Jour(s)", name: jour, widget: string, required: false }
              - { label: "Heures", name: heures, widget: string, required: false }
          - label: "Contact"
            name: contact
            widget: object
            required: false
            fields:
              - { label: "Adresse", name: adresse, widget: text, required: false }
              - { label: "Téléphone", name: telephone, widget: string, required: false }
              - { label: "Email", name: email, widget: string, required: false }
              - { label: "Texte du bouton de réservation", name: reservation_texte, widget: string, required: false }
